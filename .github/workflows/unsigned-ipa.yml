name: Build iPad IPAs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check chat storage, search and reply formatting
        run: |
          xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library \
            App/ChatArchive.swift App/WebSearch.swift App/ReplyFormat.swift App/ReplyState.swift \
            App/ContextMemory.swift App/QuattroCatalog.swift App/QuattroTools.swift App/QuattroPlan.swift \
            App/ChatWorkspace.swift App/QuattroAgent.swift scripts/check-chat.swift \
            -lsqlite3 -o "$RUNNER_TEMP/check-chat"
          "$RUNNER_TEMP/check-chat"
      - name: Build and verify iPad packages
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v6
        with:
          name: NethLocal-iPad
          path: |
            out/NethLocal-v*-unsigned.ipa
            out/NethLocal-v*-Impactor.ipa
            out/NethLocal.entitlements
          if-no-files-found: error
          compression-level: 0
