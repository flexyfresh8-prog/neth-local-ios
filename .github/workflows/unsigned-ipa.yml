name: Build Neth Local apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check chat storage, search and reply formatting
        run: |
          xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library \
            App/ChatArchive.swift App/WebSearch.swift App/ReplyFormat.swift App/ReplyState.swift \
            App/ContextMemory.swift App/QuattroCatalog.swift App/QuattroTools.swift App/QuattroPlan.swift \
            App/ChatWorkspace.swift App/QuattroAgent.swift scripts/check-chat.swift \
            -lsqlite3 -o "$RUNNER_TEMP/check-chat"
          "$RUNNER_TEMP/check-chat"
      - name: Build and verify iPad packages
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v6
        with:
          name: NethLocal-iPad
          path: |
            out/NethLocal-v*-unsigned.ipa
            out/NethLocal-v*-Impactor.ipa
            out/NethLocal.entitlements
          if-no-files-found: error
          compression-level: 0
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Qwen layer worker
        shell: pwsh
        run: |
          $source = python scripts/prepare-engine.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B .build/windows -G "Visual Studio 17 2022" -A x64 `
            "-DNETH_LLAMA_SOURCE=$source" "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" `
            "-DGGML_AVX512=OFF" "-DGGML_RPC=OFF" "-DGGML_BLAS=OFF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .build/windows --config Release --target neth-qwen-worker --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $worker = (Resolve-Path .build/windows/bin/Release/neth-qwen-worker.exe).Path
          "NETH_WORKER_EXE=$worker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check Windows pairing and worker recovery
        shell: pwsh
        run: |
          dotnet build scripts/check-windows-peer/CheckWindowsPeer.csproj -c Release "-p:WorkerExecutable=$env:NETH_WORKER_EXE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet scripts/check-windows-peer/bin/Release/net8.0-windows/CheckWindowsPeer.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish standalone Windows companion
        shell: pwsh
        run: |
          dotnet publish Windows/NethLocal.Windows.csproj -c Release -r win-x64 --self-contained true `
            "-p:PublishSingleFile=true" "-p:DebugType=none" "-p:DebugSymbols=false" `
            "-p:WorkerExecutable=$env:NETH_WORKER_EXE" --output out/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = (Get-Item out/windows/NethLocal-Windows-v*.exe).FullName
          $process = Start-Process $app -PassThru
          try {
            Start-Sleep -Seconds 4
            if ($process.HasExited) { throw "The Windows companion exited at launch." }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: NethLocal-Windows
          path: out/windows/NethLocal-Windows-v*.exe
          if-no-files-found: error
          compression-level: 0
